name: Publish to VS Code Marketplace

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run compile
      - name: Show toolchain
        run: |
          node --version
          npm --version
          node -p "'vsce ' + require('@vscode/vsce/package.json').version"
      - name: Publish (OIDC trusted publishing)
        run: node node_modules/@vscode/vsce/vsce publish --oidc
